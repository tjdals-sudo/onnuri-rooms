# Supabase CLI 설정 — `supabase config push` 는 여기 선언된 항목만 원격에 반영합니다.
# 관리자는 아이디+비밀번호 로그인(계정은 scripts/create-admins.ts 로 생성). 공개 회원가입은 끕니다.
project_id = "kpwxddwxlfujfjizwfwd"

[auth]
# 신규 가입 차단 (관리자 3계정은 service role 로 생성)
enable_signup = false
site_url = "https://onnuri-rooms.vercel.app"
additional_redirect_urls = [
  "https://onnuri-rooms.vercel.app/admin",
  "https://onnuri-rooms.vercel.app/admin/login",
  "http://localhost:3000/admin",
  "http://localhost:3000/admin/login"
]

[auth.email]
# 이메일(아이디+비밀번호) 로그인 제공자 — false 로 두면 로그인 자체가 막힘
enable_signup = true
enable_confirmations = false
